name: Build Ụzọ Android APK & Release Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/upload-keystore.jks
          else
            keytool -genkeypair -v \
              -keystore android/app/keystore/upload-keystore.jks \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias uzo_upload_key \
              -storepass "UzoIgboPlayStore2026!" \
              -keypass "UzoIgboPlayStore2026!" \
              -dname "CN=Uzo Igbo, OU=Mobile, O=Uzo Igbo Language, L=Enugu, ST=Enugu, C=NG"
          fi
          echo "storePassword=UzoIgboPlayStore2026!" > android/key.properties
          echo "keyPassword=UzoIgboPlayStore2026!" >> android/key.properties
          echo "keyAlias=uzo_upload_key" >> android/key.properties
          echo "storeFile=app/keystore/upload-keystore.jks" >> android/key.properties

      - name: Build Standalone Release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation -v > build_output.log 2>&1 || true
          tail -n 80 build_output.log
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Release APK was not generated."
            exit 1
          fi

      - name: Push Error Log to Debug Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          tail -n 120 build_output.log > BUILD_FAILURE_REASON.txt
          git add BUILD_FAILURE_REASON.txt
          git commit -m "Auto-capture build error log"
          git push origin debug-log --force

      - name: Build Google Play App Bundle (.aab)
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uzo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uzo-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
