name: uzo
description: "Ụzọ - Cultural Igbo Language Learning & Real-Time Travel Companion for Android and iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/c2508e8b-igbo-logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#F5F0E8"
  adaptive_icon_foreground: "assets/images/c2508e8b-igbo-logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/mascot/
    - assets/images/
    - assets/data/
    - assets/audio/
    - assets/icons/
